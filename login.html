<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Log in to EduSphere">
  <title>EduSphere — Log in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <main class="login-page">
    <section class="login-card">
      <a class="brand" href="dashboard.html"><span class="brand-mark">E</span>EduSphere</a>
      <p class="eyebrow">WELCOME BACK</p>
      <h1>Log in to your workspace</h1>
      <p class="intro">Pick up right where you left off.</p>

      <form class="login-form" id="loginform">

        <label>Email address<input type="email" name="email" id="loginemail" placeholder="you@example.com" autocomplete="email" required></label>
        <label>Password<input type="password" name="password" id="loginpass" placeholder="Enter your password" autocomplete="current-password" required></label>
        <div class="form-options"><label class="remember"><input type="checkbox"> Remember me</label><a href="#">Forgot password?</a></div>
        <button type="submit">Log in <span>→</span></button>

      </form>

      <div class="divider"><span>or</span></div>
      <button class="secondary-button" type="button">Continue with Google</button>
      <p class="form-footer">New to EduSphere? <a href="register.html">Create an account</a></p>
    </section>
  </main>
</body>
<script src="login.js"></script>
</html>
